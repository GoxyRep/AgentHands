[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-hands"
version = "1.0.0"
description = "Hardware KVM hands for Hermes — PiKVM API client with policy gate, audit, and safe defaults"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes Hands" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
